# companies.yaml — seed list and watchlist for jobfeed
#
# Fields per company:
#   name    Company name as you'd search for it (required)
#   bucket  Why it's on the list: seattle-hiring | seattle-ai | seattle-local | remote-infra
#   origin  seed (added by hand) | harvested (added automatically from aggregator apply links)
#   ats     greenhouse | lever | ashby | unsupported — filled in by `jobfeed discover`
#   slug    The company's board name on that ATS — filled in by `jobfeed discover`
#   watch   true = list first in the digest and never drop for a missing salary
#
# Run `jobfeed discover` once after editing. It fills in ats and slug for each
# entry where they're null, and marks companies it can't find as `unsupported`.

companies:

