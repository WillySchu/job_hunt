# config.yaml — the rules that decide what reaches the digest.
#
# Patterns are regular expressions, matched case-insensitively against whole
# words, so "front ?end" matches "Frontend" and "Front End" but not "storefront".
# Edit freely, then check the effect with `jobfeed replay --from <dump> --all`.

role:
  # A title must match at least one of these...
  include:
    - 'engineer(ing)?'
    - developer
    - swe
    - sre
    - backend
    - platform
    - infrastructure
    - member of technical staff     # Anthropic/OpenAI-style SWE titles
  # ...and none of these.
  exclude:
    - 'front ?end'
    - 'full ?stack'
    - ui engineer
    - web developer
    - manager
    - director
    - head of
    - 'intern(ship)?'
    - recruiter
    # Engineer titles that aren't software roles. Delete any you'd want to see.
    - sales engineer
    - 'solutions? engineer'
    - support engineer
    - mechanical
    - electrical
    - hardware
    - manufacturing
  # Descriptions heavier in these than in backend_terms get a
  # "possibly full stack" tag. The posting still goes through.
  # (Quote any pattern with ? * + [ ] or a backslash in it.)
  frontend_terms: [react, vue, angular, css, 'next\.js', tailwind, redux, html, frontend, front-end]
  backend_terms: [golang, rust, java, scala, kotlin, 'c\+\+', python, distributed systems, kafka,
                  'postgres(ql)?', mysql, kubernetes, grpc, microservices, backend, back-end, infrastructure]

location:
  # Remote postings pass when their region is one of these. "unknown" is a
  # remote posting that doesn't say where.
  remote_regions: [us, americas, global, unknown]
  # Remote postings that list eligible states must include this one, and
  # postings that list excluded states must not.
  home_state: WA
  # Hybrid and onsite postings need a city from this list (in home_state, or
  # with no state given).
  metro: [Seattle, Bellevue, Redmond, Kirkland, Bothell, Issaquah, Renton, Lynnwood]

salary:
  floor_usd: 150000
  compare: max          # max: the top of the range must reach the floor; min: the bottom must
  keep_missing: true    # true: postings with no USD salary go to "No salary listed"; false: dropped

seniority:
  # Sort order within each digest section. Never used to drop anything.
  prefer: [senior, staff]

digest:
  max_per_section: 50

aggregators:
  # Remote-only job boards that cover many companies at once. Each posting links
  # back to the aggregator's page and is credited in the digest ("via Remotive"),
  # as their terms ask.
  remotive: true
  remotive_category: software-dev   # a Remotive category slug, or `all`; one call per run (limit is 4 a day)
  remoteok: true
  remoteok_tags: []                 # e.g. [backend, golang]; [] = the newest ~100 postings of every kind
  himalayas: true
  himalayas_queries: [software engineer, backend engineer, platform engineer]
  himalayas_country: US             # postings open to this country; "" for any
  himalayas_pages: 2                # 20 postings a page, per query
  # When an aggregator posting for an engineering role links to a company's own
  # Greenhouse, Lever or Ashby board, add that company to companies.yaml
  # (origin: harvested) so its board is polled from the next run.
  harvest: true

tracking:
  # Recorded on every application you log with `jobfeed apply`, so the stats can
  # compare versions later. Change it when you start sending a new resume, or
  # pass --resume on one application to try a version out.
  resume_version: v1
  cover_letter: false   # true if you usually send one; --cover-letter / --no-cover-letter per application
  # The digest's "Your applications" block lists an open application to follow
  # up on once it has been quiet this many days. An application with no reply
  # this many days after applying is closed as "no response" (`jobfeed mark
  # CODE reopen` restarts the clock). Later stages are never closed this way.
  follow_up_days: 10
  no_response_days: 21
