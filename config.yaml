# config.yaml — the rules that decide what reaches the digest.
#
# Patterns are regular expressions, matched case-insensitively against whole
# words, so "front ?end" matches "Frontend" and "Front End" but not "storefront".
# Edit freely, then check the effect with `jobfeed replay --from <dump> --all`.

role:
  # A title must match at least one of these...
  include:
    - 'engineer(ing)?'
    - developer
    - swe
    - sre
    - backend
    - platform
    - infrastructure
    - member of technical staff     # Anthropic/OpenAI-style SWE titles
  # ...and none of these.
  exclude:
    - 'front ?end'
    - 'full ?stack'
    - ui engineer
    - web developer
    - manager
    - director
    - head of
    - 'intern(ship)?'
    - recruiter
    # Engineer titles that aren't software roles. Delete any you'd want to see.
    - sales engineer
    - 'solutions? engineer'
    - support engineer
    - mechanical
    - electrical
    - hardware
    - manufacturing
  # Descriptions heavier in these than in backend_terms get a
  # "possibly full stack" tag. The posting still goes through.
  # (Quote any pattern with ? * + [ ] or a backslash in it.)
  frontend_terms: [react, vue, angular, css, 'next\.js', tailwind, redux, html, frontend, front-end]
  backend_terms: [golang, rust, java, scala, kotlin, 'c\+\+', python, distributed systems, kafka,
                  'postgres(ql)?', mysql, kubernetes, grpc, microservices, backend, back-end, infrastructure]

location:
  # Remote postings pass when their region is one of these. "unknown" is a
  # remote posting that doesn't say where.
  remote_regions: [us, americas, global, unknown]
  # Remote postings that list eligible states must include this one, and
  # postings that list excluded states must not.
  home_state: WA
  # Hybrid and onsite postings need a city from this list (in home_state, or
  # with no state given).
  metro: [Seattle, Bellevue, Redmond, Kirkland, Bothell, Issaquah, Renton, Lynnwood]

salary:
  floor_usd: 150000
  compare: max          # max: the top of the range must reach the floor; min: the bottom must
  keep_missing: true    # true: postings with no USD salary go to "No salary listed"; false: dropped

seniority:
  # Sort order within each digest section. Never used to drop anything.
  prefer: [senior, staff]

digest:
  max_per_section: 50

aggregators:
  # Remote-only job boards that cover many companies at once. Each posting links
  # back to the aggregator's page and is credited in the digest ("via Remotive"),
  # as their terms ask.
  remotive: true
  remotive_category: software-dev   # a Remotive category slug, or `all`; one call per run (limit is 4 a day)
  remoteok: true
  remoteok_tags: []                 # e.g. [backend, golang]; [] = the newest ~100 postings of every kind
  himalayas: true
  himalayas_queries: [software engineer, backend engineer, platform engineer]
  himalayas_country: US             # postings open to this country; "" for any
  himalayas_pages: 2                # 20 postings a page, per query
  # When an aggregator posting for an engineering role links to a company's own
  # Greenhouse, Lever or Ashby board, add that company to companies.yaml
  # (origin: harvested) so its board is polled from the next run.
  harvest: true

tracking:
  # Recorded on every application you log with `jobfeed apply`, so the stats can
  # compare versions later. Change it when you start sending a new resume, or
  # pass --resume on one application to try a version out.
  resume_version: v1
  cover_letter: false   # true if you usually send one; --cover-letter / --no-cover-letter per application
  # The digest's "Your applications" block lists an open application to follow
  # up on once it has been quiet this many days. An application with no reply
  # this many days after applying is closed as "no response" (`jobfeed mark
  # CODE reopen` restarts the clock). Later stages are never closed this way.
  follow_up_days: 10
  no_response_days: 21
  # Each run reads your replies to the digest from Gmail (read-only, over IMAP,
  # with the same app password) and carries out the commands in them. IMAP has
  # to be on: Gmail → Settings → See all settings → Forwarding and POP/IMAP.
  read_mail: true
  # Job mail is read from these applicant-tracking systems' sending domains, and
  # from the companies you have open applications with. Add a domain if a
  # company's confirmations come from a system not listed (`jobfeed mail
  # --dry-run` shows what was read).
  ats_senders: [greenhouse-mail.io, greenhouse.io, lever.co, ashbyhq.com]
  # The run on weekly_day also emails a weekly report (what `jobfeed stats`
  # shows, plus last week's applications and news) and copies jobs.db to
  # backups/, keeping the newest backups_kept copies (0 turns backups off).
  # jobs.db now holds application history that can't be fetched again, so
  # copy backups/ off the Pi now and then.
  weekly_report: true
  weekly_day: monday
  backups_kept: 8
  # The weekly report also carries a gzipped copy of jobs.db, so a copy lives in
  # Gmail, off the Pi. If it ever grows too big to attach, the report says so at
  # the top (and warns beforehand).
  attach_backup: true

fit:
  # Every posting the digest sends gets a fit score from 0 to 100: how well you
  # match what it asks for. Scores are stored but hidden during the baseline
  # (FIT_SCORER_SPEC.md); `jobfeed fit profile` shows what was read from the
  # resume, and never shows a posting's score.
  enabled: true
  resume_url: https://raw.githubusercontent.com/WillySchu/pandoc_resume/master/markdown/resume.md
  # The keyword scorer looks for ~70 built-in technical terms (`fit.terms`; see
  # DEFAULT_FIT_TERMS in jobfeed/config.py). Add your own as "Name: pattern",
  # a regular expression matched as whole words, ignoring case:
  extra_terms: []        # e.g. ["Ray: ray", "Kubeflow: kubeflow"]
  # Your skills come from the resume: terms it names, basic where its entry
  # says "basic" or "some". Override by term name:
  strong: []             # e.g. [JavaScript]
  basic: []              # e.g. [Machine learning]
  extra_skills: []       # skills you have that the resume doesn't show
  experience_years: 0    # 0: from the resume's earliest date
  # The LLM scorer: Claude reads each posting against the resume. It runs when
  # ANTHROPIC_API_KEY is in .env; `jobfeed fit check` tests the key on a made-up
  # posting. Each run scores its digest postings, then any backlog, newest first.
  llm: true
  llm_model: claude-haiku-5-5
  llm_effort: low
  llm_max_per_run: 300
  llm_monthly_budget: 5.0   # USD; scoring pauses for the rest of the month once spent
  llm_concurrency: 4
  context_note: ""          # a line or two the resume doesn't say, e.g. recent work not on it yet
