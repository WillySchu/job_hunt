[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jobfeed"
version = "0.1.0"
description = "Daily email digest of new software engineering job postings"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
jobfeed = "jobfeed.cli:main"

[tool.setuptools.packages.find]
include = ["jobfeed*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
